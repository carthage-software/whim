[package]
name = "whim-pgsql"
description = "The non-blocking PostgreSQL driver used by Whim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["openssl-sys"]

[lints]
workspace = true

[dependencies]
itoa = { workspace = true }
pq-sys = { workspace = true }
ryu = { workspace = true }
whim-loop = { workspace = true }

[target.'cfg(not(target_os = "freebsd"))'.dependencies]
openssl-sys = { workspace = true }
pq-sys = { workspace = true, features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock"] }
