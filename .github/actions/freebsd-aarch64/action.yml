name: FreeBSD aarch64
description: Build on the host and run Whim tests in FreeBSD.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.98.0
      with:
        targets: aarch64-unknown-freebsd
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild@0.22.2
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.15.2
    - uses: Swatinem/rust-cache@v2
      with:
        key: freebsd-aarch64
    - uses: vmactions/freebsd-vm@v1
      with:
        release: '14.4'
        arch: aarch64
        mem: 5120
        cpu: 2
        sync: 'no'
        copyback: false
        cache-after-prepare: true
        prepare: |
          set -eu
          mkdir -p /usr/local/etc/pkg/repos
          echo 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
          pkg install -y ca_root_nss curl git postgresql18-client rsync
    - name: Copy sources and FreeBSD libpq
      shell: bash
      run: |
        ssh freebsd "mkdir -p '$GITHUB_WORKSPACE'"
        rsync -a --rsync-path=/usr/local/bin/rsync --exclude=/target/ --exclude=/.git/ "$GITHUB_WORKSPACE/" "freebsd:$GITHUB_WORKSPACE/"
        mkdir -p target/freebsd-libs
        scp freebsd:/usr/local/lib/libpq.so.5 target/freebsd-libs/libpq.so
    - name: Build Whim
      shell: bash
      env:
        PQ_LIB_DIR_AARCH64_UNKNOWN_FREEBSD: ${{ github.workspace }}/target/freebsd-libs
      run: cargo zigbuild --locked --release --target aarch64-unknown-freebsd --bin whim
    - name: Test Whim
      shell: bash
      run: |
        rsync -aR --rsync-path=/usr/local/bin/rsync "$GITHUB_WORKSPACE/target/aarch64-unknown-freebsd/release/whim" freebsd:/
        ssh freebsd "cd '$GITHUB_WORKSPACE' && target/aarch64-unknown-freebsd/release/whim tests/run.whim '' 2"
