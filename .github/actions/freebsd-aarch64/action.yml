name: FreeBSD aarch64
description: Build on the host and run tests in FreeBSD.

inputs:
  checks:
    description: Run Clippy and Rust tests.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.98.0
      with:
        targets: aarch64-unknown-freebsd
        components: clippy
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild@0.22.2
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.15.2
    - uses: Swatinem/rust-cache@v2
      with:
        key: freebsd-aarch64-${{ inputs.checks }}
    - uses: vmactions/freebsd-vm@v1
      with:
        release: '14.4'
        arch: aarch64
        mem: 5120
        cpu: 2
        sync: 'no'
        copyback: false
        cache-after-prepare: true
        prepare: |
          set -eu
          mkdir -p /usr/local/etc/pkg/repos
          echo 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
          pkg install -y ca_root_nss cmake curl git pkgconf postgresql18-client rsync rust
    - name: Copy sources and FreeBSD libpq
      shell: bash
      run: |
        ssh freebsd "mkdir -p '$GITHUB_WORKSPACE'"
        rsync -a --rsync-path=/usr/local/bin/rsync --exclude=/target/ --exclude=/.git/ "$GITHUB_WORKSPACE/" "freebsd:$GITHUB_WORKSPACE/"
        mkdir -p target/freebsd-libs
        scp freebsd:/usr/local/lib/libpq.so.5 target/freebsd-libs/libpq.so
    - name: Check Rust
      if: inputs.checks == 'true'
      shell: bash
      env:
        PQ_LIB_DIR_AARCH64_UNKNOWN_FREEBSD: ${{ github.workspace }}/target/freebsd-libs
        CARGO_PROFILE_DEV_DEBUG: '0'
        CARGO_PROFILE_TEST_DEBUG: '0'
        CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_RUNNER: ${{ github.workspace }}/.github/actions/freebsd-aarch64/run.sh
      run: |
        ssh freebsd "cd '$GITHUB_WORKSPACE' && cargo fetch --locked --target aarch64-unknown-freebsd"
        cargo-zigbuild clippy --locked --workspace --all-targets --all-features --target aarch64-unknown-freebsd
        cargo-zigbuild test --locked --workspace --all-features --target aarch64-unknown-freebsd
    - name: Build Whim
      shell: bash
      env:
        PQ_LIB_DIR_AARCH64_UNKNOWN_FREEBSD: ${{ github.workspace }}/target/freebsd-libs
      run: cargo zigbuild --locked --release --target aarch64-unknown-freebsd --bin whim
    - name: Test Whim
      shell: bash
      run: .github/actions/freebsd-aarch64/run.sh "$GITHUB_WORKSPACE/target/aarch64-unknown-freebsd/release/whim" tests/run.whim '' 2
