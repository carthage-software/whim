[graph]
all-features = true
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "riscv64gc-unknown-linux-gnu",
]

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Transitive through serde-seeded; no maintained release is available." },
  { id = "RUSTSEC-2025-0134", reason = "The current rustls-pemfile release remains functional while its API is migrated." },
  { id = "RUSTSEC-2025-0141", reason = "Bincode 1.3.3 is complete but no longer maintained." },
  { id = "RUSTSEC-2026-0247", reason = "Bitmaps is transitive through imbl and has no maintained compatible release." },
  { crate = "chacha20@0.10.1", reason = "The yanked release is transitive through tungstenite and rand." },
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "PostgreSQL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
