[package]
name = "whim"
description = "An experimental programming language built for exploration."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*", "lib"]
default-members = ["."]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Seifeddine Gmati <azjezz@carthage.software>"]
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/carthage-software/whim"
publish = false

[workspace.lints.rust]
unused_imports = { level = "deny" }
unused_qualifications = { level = "deny" }
absolute_paths_not_starting_with_crate = { level = "deny" }
elided_lifetimes_in_paths = { level = "deny" }
unreachable_pub = { level = "deny" }
unsafe_op_in_unsafe_fn = { level = "deny" }

[workspace.lints.clippy]
absolute_paths = { level = "deny" }
allow_attributes = { level = "deny" }
clone_on_ref_ptr = { level = "deny" }
dbg_macro = { level = "deny" }
large_enum_variant = { level = "deny" }
let_underscore_lock = { level = "deny" }
missing_safety_doc = { level = "deny" }
print_stderr = { level = "deny" }
print_stdout = { level = "deny" }
single_component_path_imports = { level = "deny" }
undocumented_unsafe_blocks = { level = "deny" }
unnecessary_self_imports = { level = "deny" }
wildcard_imports = { level = "deny" }

[workspace.dependencies]
allocator-api2 = "0.2"
annotate-snippets = "0.12"
argon2 = "0.5.3"
base16ct = { version = "1.0.0", features = ["alloc"] }
base32ct = { version = "0.3.1", features = ["alloc"] }
base64ct = "1.8.3"
bcrypt = "0.19.3"
bincode = "2.0"
blake2 = "0.10.6"
blake3 = "1.8.6"
blink-alloc = "0.3"
brotli = "8.0.2"
bson = { version = "3.1.0", features = ["serde"] }
bytes = "1"
caseless = "0.2.2"
clap = { version = "4.6", features = ["derive"] }
constant_time_eq = "0.5.0"
corosensei = "0.3"
crc32c = "0.6.8"
crc32fast = "1.5.0"
csv-core = "0.1.13"
data-encoding = "2.11.1"
file-format = { version = "0.29.0", features = ["reader-txt", "reader-xml"] }
flate2 = "1.1.9"
foldhash = "0.2"
fs2 = "0.4.3"
getrandom = "0.3.4"
globset = "0.4.16"
hashbrown = "0.17.1"
hmac = "0.13.0"
htmlize = { version = "1.1.0", features = ["unescape"] }
httlib-hpack = "0.1.3"
httparse = "1.10.1"
idna = "1.1.0"
imbl = "6.1.0"
indoc = "2"
iri-string = { version = "0.7.14", features = ["memchr"] }
itoa = "1"
jiff = "0.2.35"
lexical-core = { version = "1.0.6", default-features = false, features = ["parse-floats", "parse-integers"] }
libc = "0.2"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
mail-parser = "0.11.7"
mailrs-rfc2047 = "1.1.2"
md-5 = "0.11.0"
memchr = "2.7.4"
mimalloc = "0.1"
num-bigint = "0.5.1"
openssl-sys = { version = "0.9", features = ["vendored"] }
pbkdf2 = "0.13.0"
percent-encoding = "2.3.2"
polling = "3"
pq-sys = { version = "0.7.5", default-features = false, features = ["bundled"] }
proc-macro2 = "1"
proptest = "1"
pubgrub = "0.4.0"
punycode = "0.4.1"
quote = "1"
quoted_printable = "0.5.2"
rayon = "1.10"
regex = "1.12.2"
ripemd = "0.2.0"
rusqlite = { version = "0.40.1", features = ["bundled", "column_decltype", "hooks"] }
rustix = { version = "1.1.4", features = ["fs", "net", "pipe", "process", "termios"] }
rustls = "0.23.42"
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
ryu = "1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-seeded = "0.1"
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
signal-hook = "0.3"
simd-adler32 = "0.3.10"
similar = "2.6"
sonic-rs = "0.5.8"
spdx = "0.13.5"
syn = { version = "3", features = ["full", "fold"] }
tar = { version = "0.4.46", default-features = false }
target-guard = { package = "whim-support", path = "crates/support", version = "0.2.0" }
thiserror = "2.0.19"
toml = "0.8"
toml_edit = "0.25.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
tungstenite = { version = "0.30.0", default-features = false }
unicode-general-category = "1.1.0"
unicode-width = "0.2"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "v7"] }
whim-formatter = { path = "crates/formatter", version = "0.2.0" }
whim-loop = { path = "crates/loop", version = "0.2.0" }
whim-macros = { path = "crates/macros", version = "0.2.0" }
whim-pgsql = { path = "crates/pgsql", version = "0.2.0" }
whim-runtime = { path = "crates/runtime", version = "0.2.0" }
whim-span = { path = "crates/span", version = "0.2.0" }
whim-sqlite = { path = "crates/sqlite", version = "0.2.0" }
whim-lib = { path = "lib", version = "0.2.0" }
whim-syn = { path = "crates/syn", version = "0.2.0" }
x509-parser = "0.18.1"
xxhash-rust = { version = "0.8.18", features = ["xxh64", "xxh3"] }
zstd = "0.13.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true }
fs2 = { workspace = true }
globset = { workspace = true }
indoc = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
libc = { workspace = true }
mimalloc = { workspace = true }
pubgrub = { workspace = true }
rayon = { workspace = true }
rustix = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
spdx = { workspace = true }
tar = { workspace = true }
target-guard = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
whim-formatter = { workspace = true, features = ["serde"] }
whim-runtime = { workspace = true }
whim-span = { workspace = true }
whim-lib = { workspace = true }
whim-syn = { workspace = true }
